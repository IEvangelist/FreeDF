<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C# PDF Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/editor.css">
</head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></symbol>
  <symbol id="i-square" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></symbol>
  <symbol id="i-ellipse" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M20 16l-4.5-4.5L7 20"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v6a4 4 0 004 4h4a4 4 0 014 4v2M18 4v6M6 20v-2M16 8l2-2 2 2"/></symbol>
  <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8H8M8 1l-4 3 4 3"/></symbol>
  <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-8-8h4M16 1l4 3-4 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-zoomin" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-zoomout" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z"/></symbol>
  <symbol id="i-italic" viewBox="0 0 24 24"><path d="M10 5h8M6 19h8M14 5l-4 14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></symbol>
  <symbol id="i-front" viewBox="0 0 24 24"><rect x="3" y="3" width="11" height="11" rx="2"/><path d="M10 21h9a2 2 0 002-2v-9"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5"/></symbol>
  <symbol id="i-redact" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1" fill="currentColor"/><path d="M5 4h6M13 4h6M5 20h8"/></symbol>
  <symbol id="i-sidel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
  <symbol id="i-sider" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
</defs></svg>
<header>
  <button id="tl" class="icon toggle on" title="Toggle pages panel ([)" aria-pressed="true"><svg class="i"><use href="#i-sidel"/></svg></button>
  <div class="brand"><span class="logo">C#</span><strong>PDF Editor</strong></div>
  <div class="doc"><svg class="i"><use href="#i-file"/></svg><span id="name">No document</span><span id="pages"></span></div>
  <div class="group">
    <label class="btn" title="Open a PDF"><svg class="i"><use href="#i-open"/></svg><span class="lbl">Open</span><input id="open" type="file" accept="application/pdf" hidden></label>
    <label class="btn" title="Append pages from another PDF"><svg class="i"><use href="#i-merge"/></svg><span class="lbl">Merge</span><input id="merge" type="file" accept="application/pdf" hidden></label>
  </div>
  <span class="sp"></span>
  <div class="group">
    <button id="rl" class="icon" title="Rotate page left"><svg class="i"><use href="#i-rotl"/></svg></button>
    <button id="rr" class="icon" title="Rotate page right"><svg class="i"><use href="#i-rotr"/></svg></button>
    <button id="del" class="icon" title="Delete page"><svg class="i"><use href="#i-trash"/></svg></button>
    <button id="title" class="icon" title="Set document title"><svg class="i"><use href="#i-tag"/></svg></button>
  </div>
  <span class="sp"></span>
  <button id="dl" class="primary" title="Download the edited PDF"><svg class="i"><use href="#i-download"/></svg><span class="lbl">Download</span></button>
  <button id="tr" class="icon toggle on" title="Toggle properties panel (])" aria-pressed="true"><svg class="i"><use href="#i-sider"/></svg></button>
</header>
<main>
  <div id="thumbs"></div>
  <div id="center">
    <div id="tools">
      <div class="seg" role="toolbar" aria-label="Tools">
        <button data-tool="select" class="on icon" title="Select and move (V)"><svg class="i"><use href="#i-select"/></svg></button>
        <button data-tool="text" class="icon" title="Add text (T)"><svg class="i"><use href="#i-text"/></svg></button>
        <button data-tool="rect" class="icon" title="Rectangle (R)"><svg class="i"><use href="#i-rect"/></svg></button>
        <button data-tool="ellipse" class="icon" title="Ellipse (E)"><svg class="i"><use href="#i-ellipse"/></svg></button>
        <button data-tool="line" class="icon" title="Line (L)"><svg class="i"><use href="#i-line"/></svg></button>
        <button data-tool="redact" class="icon" title="Redact: permanently removes content beneath (X)"><svg class="i"><use href="#i-redact"/></svg></button>
        <label class="btn icon" title="Insert image"><svg class="i"><use href="#i-image"/></svg><input id="img" type="file" accept="image/png,image/jpeg" hidden></label>
      </div>
      <span class="grow"></span>
      <button id="prev" title="Show the real rendered output"><svg class="i"><use href="#i-eye"/></svg>Preview</button>
      <span class="sp"></span>
      <div class="group">
        <button id="zo" class="icon" title="Zoom out"><svg class="i"><use href="#i-zoomout"/></svg></button><span id="zv">100%</span><button id="zi" class="icon" title="Zoom in"><svg class="i"><use href="#i-zoomin"/></svg></button>
      </div>
    </div>
    <div id="view"><div id="empty"><svg class="i"><use href="#i-file"/></svg><strong>No document open</strong><span>Open a PDF or drop one here.</span></div></div>
  </div>
  <aside id="props"></aside>
</main>
<footer><span id="status">Pick a tool and drag on the page. Click page text to edit it. Ctrl+Z undoes.</span><span class="sp"></span><span id="keys"><kbd>Shift</kbd> square / lock axis <kbd>Alt</kbd> from centre <kbd>[</kbd> <kbd>]</kbd> panels <kbd>Ctrl+D</kbd> duplicate</span></footer>
<script>
let state = { version: 0, pages: [] }, sel = 0, dragFrom = -1;
let items = [], cur = null, tool = 'select', zoom = 1, preview = false, undo = [], saveT = 0, editing = false;
const $ = id => document.getElementById(id);
const post = (u, body) => fetch(u, { method: 'POST', body }).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); });
const status = t => $('status').textContent = t;
const FAM = { Helvetica: 'Arial, Helvetica, sans-serif', Times: '"Times New Roman", Times, serif', Courier: '"Courier New", monospace' };
let S = 1, geom = null, spans = [], origKey = '', fields = [], objs = [], curObj = null;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const ic = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const okey = () => items.filter(i => i.orig != null).map(i => i.orig).sort((a, b) => a - b).join(',');
const fontFamily = n => /courier|mono/i.test(n) ? 'Courier' : /times|serif|georgia|garamond|minion/i.test(n) && !/sans/i.test(n) ? 'Times' : 'Helvetica';

// Turns an existing page text run into an editable text item; the original operator is removed on the server.
function convertSpan(s) {
  pushUndo();
  const it = { id: crypto.randomUUID(), type: 'text', x: s.x, y: s.y - 0.95 * s.size, w: 0, h: 0, text: s.text, font: fontFamily(s.font),
    size: s.size, bold: /bold|black|heavy/i.test(s.font), italic: /italic|oblique/i.test(s.font), color: s.color, fill: '', stroke: '', strokeWidth: 0,
    opacity: 1, asset: '', x2: 0, y2: 0, orig: s.index };
  items.push(it); cur = it; curObj = null; paint(); props(); queueSave();
}

async function refresh() {
  await flush();
  state = await (await fetch('/api/state')).json();
  $('name').textContent = state.pageCount ? state.fileName : 'No document';
  $('pages').textContent = state.pageCount ? `${state.pageCount} page${state.pageCount === 1 ? '' : 's'}` : '';
  sel = Math.min(sel, state.pageCount - 1); if (sel < 0) sel = 0;
  const t = $('thumbs'); t.innerHTML = '';
  state.pages.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (i === sel ? ' sel' : ''); d.draggable = true;
    d.innerHTML = `<div class="paper"><img src="/api/page/${i}.png?dpi=40&v=${state.version}"></div><span class="num">${i + 1}</span>
      <div class="acts"><button class="mini" data-a="l" title="Rotate left">${ic('rotl')}</button><button class="mini" data-a="r" title="Rotate right">${ic('rotr')}</button><button class="mini danger" data-a="x" title="Delete page">${ic('trash')}</button></div>`;
    d.onclick = e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a === 'l') act(() => post(`/api/rotate/${i}/270`));
      else if (a === 'r') act(() => post(`/api/rotate/${i}/90`));
      else if (a === 'x') { sel = i; act(() => post(`/api/delete/${i}`)); }
      else { flush().then(() => { sel = i; select(); }); }
    };
    d.ondragstart = () => dragFrom = i;
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); if (dragFrom >= 0 && dragFrom !== i) { sel = i; act(() => post(`/api/move/${dragFrom}/${i}`)); } dragFrom = -1; };
    t.appendChild(d);
  });
  await select();
}

async function select() {
  document.querySelectorAll('.thumb').forEach((e, i) => e.classList.toggle('sel', i === sel));
  const v = $('view');
  if (!state.pageCount) { v.innerHTML = '<div id="empty">' + ic('file') + '<strong>No document open</strong><span>Open a PDF or drop one here.</span></div>'; items = []; props(); return; }
  items = await (await fetch(`/api/page/${sel}/items`)).json();
  spans = await (await fetch(`/api/page/${sel}/text`)).json();
  objs = await (await fetch(`/api/page/${sel}/objects`)).json();
  fields = await (await fetch('/api/fields')).json();
  origKey = okey();
  cur = null; curObj = null; undo = [];
  build();
}

// Page geometry: the layer lives in unrotated MediaBox space (points, y down); the CSS transform matches the page /Rotate.
function build() {
  const p = state.pages[sel], v = $('view'), r = p.rotation;
  const swap = r === 90 || r === 270;
  const w0 = swap ? p.height : p.width, h0 = swap ? p.width : p.height;
  const fit = Math.min((v.clientWidth - 48) / w0, (v.clientHeight - 48) / h0);
  S = Math.max(fit, 0.2) * zoom;
  const dw = w0 * S, dh = h0 * S, Lw = p.width * S, Lh = p.height * S;
  geom = { r, dw, dh, Lw, Lh };
  const dpi = Math.min(300, Math.max(40, Math.round(72 * S * (devicePixelRatio || 1))));
  v.innerHTML = `<div id="page" style="width:${dw}px;height:${dh}px"><img id="base" src="/api/page/${sel}.png?dpi=${dpi}&v=${state.version}&bare=${!preview}&t=${Date.now()}"><div id="layer" style="width:${Lw}px;height:${Lh}px"></div></div>`;
  const tf = { 0: '', 90: `translate(${dw}px,0) rotate(90deg)`, 180: `translate(${dw}px,${dh}px) rotate(180deg)`, 270: `translate(0,${dh}px) rotate(270deg)` }[r] ?? '';
  const layer = $('layer'); layer.style.transform = tf; layer.style.display = preview ? 'none' : 'block';
  layer.onpointerdown = layerDown;
  $('zv').textContent = Math.round(zoom * 100) + '%';
  paint(); props();
}

// Client pixel position -> layer pixel position (inverse of the rotation transform).
function toLayer(cx, cy) {
  const b = $('page').getBoundingClientRect(), x = cx - b.left, y = cy - b.top, { r, dw, dh } = geom;
  return r === 0 ? [x, y] : r === 90 ? [y, dw - x] : r === 180 ? [dw - x, dh - y] : [dh - y, x];
}

function paint() {
  const layer = $('layer'); if (!layer) return;
  layer.innerHTML = '';
  if (tool === 'select') {
    for (const o of objs) {
      if (o.edit?.delete) continue;
      const [x0, y0, x1, y1] = oBox(o);
      const e = document.createElement('div'); e.className = 'obj' + (o === curObj ? ' on' : ''); e.title = `Move or resize this ${o.kind}`;
      e.style.left = x0 * S + 'px'; e.style.top = y0 * S + 'px'; e.style.width = Math.max(x1 - x0, 1) * S + 'px'; e.style.height = Math.max(y1 - y0, 1) * S + 'px';
      e.onpointerdown = ev => { if (tool === 'select') startObjMove(ev, o); };
      if (o === curObj) for (const [k, x, y, c] of [['nw', '0%', '0%', 'nwse-resize'], ['ne', '100%', '0%', 'nesw-resize'], ['sw', '0%', '100%', 'nesw-resize'], ['se', '100%', '100%', 'nwse-resize']])
        handle(e, k, x, y, c, ev => startObjResize(ev, o, k));
      layer.appendChild(e);
    }
  }
  if (tool === 'select') {
    const used = new Set(items.filter(i => i.orig != null).map(i => i.orig));
    for (const s of spans) {
      if (used.has(s.index)) continue;
      const b = document.createElement('div'); b.className = 'span'; b.title = 'Click to edit this text';
      b.style.left = s.x * S + 'px'; b.style.top = (s.y - 0.9 * s.size) * S + 'px';
      b.style.width = Math.max(s.width, 2) * S + 'px'; b.style.height = 1.15 * s.size * S + 'px';
      b.onpointerdown = ev => { ev.stopPropagation(); convertSpan(s); };
      layer.appendChild(b);
    }
  }
  for (const it of items) {
    if (it.type === 'line') {
      // One SVG per line so lines take part in z-order with the other items.
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'lines'); svg.setAttribute('width', geom.Lw); svg.setAttribute('height', geom.Lh);
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', it.x * S); l.setAttribute('y1', it.y * S); l.setAttribute('x2', it.x2 * S); l.setAttribute('y2', it.y2 * S);
      l.setAttribute('stroke', it.stroke || '#000'); l.setAttribute('stroke-width', Math.max(it.strokeWidth * S, 1)); l.setAttribute('opacity', it.opacity);
      l.onpointerdown = e => startMove(e, it); l._it = it;
      svg.appendChild(l); layer.appendChild(svg);
      if (it === cur) lineHandles(layer, it);
      continue;
    }
    const e = document.createElement('div'); e._it = it;
    e.className = 'it' + (it === cur ? ' on' : '') + (it.type === 'text' ? ' txt' : '') + (it.type === 'redact' ? ' redact' : '');
    e.style.left = it.x * S + 'px'; e.style.top = it.y * S + 'px'; e.style.opacity = it.opacity;
    if (it.type === 'text') {
      e.textContent = it.text; e.style.fontSize = it.size * S + 'px'; e.style.color = it.color || '#000';
      e.style.fontFamily = FAM[it.font] ?? FAM.Helvetica; e.style.fontWeight = it.bold ? 700 : 400; e.style.fontStyle = it.italic ? 'italic' : 'normal';
    } else {
      e.style.width = it.w * S + 'px'; e.style.height = it.h * S + 'px';
      if (it.type === 'image') e.innerHTML = `<img src="/api/asset/${it.asset}">`;
      else {
        e.style.background = it.fill || 'transparent';
        e.style.border = it.stroke && it.strokeWidth > 0 ? `${it.strokeWidth * S}px solid ${it.stroke}` : 'none';
        e.style.boxSizing = 'border-box'; if (it.type === 'ellipse') e.style.borderRadius = '50%';
      }
    }
    e.onpointerdown = ev => { if (tool === 'select' && !e.isContentEditable) startMove(ev, it); };
    if (it.type === 'text') e.ondblclick = () => editText(e, it);
    if (it === cur && !editing) boxHandles(e, it);
    layer.appendChild(e);
  }
}

function handle(parent, cls, x, y, cursor, down) {
  const h = document.createElement('div'); h.className = 'hd';
  h.style.left = `calc(${x} - 5px)`; h.style.top = `calc(${y} - 5px)`; h.style.cursor = cursor;
  h.onpointerdown = down; parent.appendChild(h);
}
function boxHandles(e, it) {
  for (const [k, x, y, c] of [['nw', '0%', '0%', 'nwse-resize'], ['ne', '100%', '0%', 'nesw-resize'], ['sw', '0%', '100%', 'nesw-resize'], ['se', '100%', '100%', 'nwse-resize']])
    handle(e, k, x, y, c, ev => startResize(ev, it, k, e));
}
function lineHandles(layer, it) {
  for (const [a, b] of [['x', 'y'], ['x2', 'y2']]) {
    const d = document.createElement('div'); d.className = 'hd'; d.style.left = it[a] * S - 5 + 'px'; d.style.top = it[b] * S - 5 + 'px'; d.style.cursor = 'crosshair';
    d.onpointerdown = ev => drag(ev, () => { }, (p, s, e) => {
      let x = p[0] / S, y = p[1] / S;
      if (e?.shiftKey) { const ox = it[a === 'x' ? 'x2' : 'x'], oy = it[a === 'x' ? 'y2' : 'y'], dx = x - ox, dy = y - oy, an = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * Math.PI / 4, l = Math.hypot(dx, dy); x = ox + l * Math.cos(an); y = oy + l * Math.sin(an); }
      it[a] = x; it[b] = y; paint();
    });
    layer.appendChild(d);
  }
}

function drag(ev, onStart, onMove, onEnd) {
  ev.preventDefault(); ev.stopPropagation();
  const start = toLayer(ev.clientX, ev.clientY); pushUndo(); onStart(start);
  let last = ev;
  const mv = e => { last = e; onMove(toLayer(e.clientX, e.clientY), start, e); };
  // Pressing or releasing a modifier mid-drag re-applies the last pointer position.
  const key = e => { if (e.key === 'Shift' || e.key === 'Alt') onMove(toLayer(last.clientX, last.clientY), start, e); };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('keydown', key); removeEventListener('keyup', key); onEnd?.(); queueSave(); props(); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('keydown', key); addEventListener('keyup', key);
}

// Applies Shift (keep proportions / square) and Alt (resize about the centre) to a box being dragged by corner k.
function constrainBox(b0, k, dx, dy, e, lockRatio) {
  const [x0, y0, x1, y1] = b0, w0 = x1 - x0, h0 = y1 - y0, sx = k.includes('w') ? -1 : 1, sy = k.includes('n') ? -1 : 1;
  let dw = sx * dx, dh = sy * dy;
  if (e?.shiftKey || lockRatio) {
    const s = Math.abs(dw / w0) > Math.abs(dh / h0) ? dw / w0 : dh / h0;
    dw = s * w0; dh = s * h0;
  }
  const f = e?.altKey ? 2 : 1, nw = Math.max(2, w0 + dw * f), nh = Math.max(2, h0 + dh * f);
  if (e?.altKey) { const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2; return [cx - nw / 2, cy - nh / 2, cx + nw / 2, cy + nh / 2]; }
  return [sx > 0 ? x0 : x1 - nw, sy > 0 ? y0 : y1 - nh, sx > 0 ? x0 + nw : x1, sy > 0 ? y0 + nh : y1];
}

function startMove(ev, it) {
  cur = it; curObj = null; let o;
  drag(ev, () => { o = { ...it }; paint(); props(); },
    (p, s, e) => {
      let dx = (p[0] - s[0]) / S, dy = (p[1] - s[1]) / S;
      if (e?.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
      it.x = o.x + dx; it.y = o.y + dy;
      if (it.type === 'line') { it.x2 = o.x2 + dx; it.y2 = o.y2 + dy; }
      paint();
    });
}

function startResize(ev, it, k, el) {
  let o, w0, h0;
  drag(ev, () => { o = { ...it }; w0 = el.offsetWidth / S; h0 = el.offsetHeight / S; },
    (p, s, e) => {
      const dx = (p[0] - s[0]) / S, dy = (p[1] - s[1]) / S;
      if (it.type === 'text') { it.size = Math.max(4, Math.round(o.size * (h0 + (k[0] === 'n' ? -dy : dy)) / h0 * 10) / 10); paint(); return; }
      const [x0, y0, x1, y1] = constrainBox([o.x, o.y, o.x + o.w, o.y + o.h], k, dx, dy, e, it.type === 'image');
      it.x = x0; it.y = y0; it.w = Math.max(4, x1 - x0); it.h = Math.max(4, y1 - y0);
      paint();
    });
}

function layerDown(ev) {
  if (tool === 'select') { cur = null; curObj = null; paint(); props(); return; }
  const kind = tool;
  const base = { id: crypto.randomUUID(), type: kind, x: 0, y: 0, w: 0, h: 0, text: '', font: 'Helvetica', size: 18, bold: false, italic: false, color: '#000000',
    fill: '', stroke: '#000000', strokeWidth: 1, opacity: 1, asset: null, x2: 0, y2: 0 };
  let it;
  if (kind === 'text') {

      { label: 'Arrange', sub: [

        { label: 'Bring Forward', key: mod + ']', disabled: last, run: () => arrange(it, 'forward') },
        { label: 'Send Backward', key: mod + '[', disabled: first, run: () => arrange(it, 'backward') },
        { label: 'Send to Back', key: mod + 'Shift+[', disabled: first, run: () => arrange(it, 'back') }] },
      { label: 'Align to page', sub: [
        { label: 'Left', run: () => alignTo(it, 'left') }, { label: 'Center horizontally', run: () => alignTo(it, 'center') }, { label: 'Right', run: () => alignTo(it, 'right') }, '-',
        { label: 'Top', run: () => alignTo(it, 'top') }, { label: 'Middle vertically', run: () => alignTo(it, 'middle') }, { label: 'Bottom', run: () => alignTo(it, 'bottom') }] },
      it.type !== 'redact' && { label: 'Redact this area', run: () => redactItem(it) },
      '-',
      { label: 'Delete', key: 'Del', danger: true, run: () => commit(() => { items = items.filter(x => x !== it); cur = null; }) },
    ];
  }
  if (objEl) {
    const o = objs.find(o => !o.edit?.delete && (() => { const [x0, y0, x1, y1] = oBox(o); return here.x >= x0 && here.x <= x1 && here.y >= y0 && here.y <= y1; })());
    if (o) {
      selectObj(o);
      return [
        { label: 'Delete', key: 'Del', danger: true, run: () => deleteObj(o) },
        o.edit && { label: 'Reset position and size', run: () => { pushUndo(); o.edit = null; paint(); props(); saveObj(o); } },
      ];
    }
  }
  const ts = t.closest?.('.span');
  return [
    { label: 'Paste here', key: mod + 'V', disabled: !clip, run: () => paste(here) },
    { label: 'Add text here', run: () => commit(() => { cur = mkItem('text', here.x, here.y); items.push(cur); }) },
    { label: 'Add rectangle here', run: () => commit(() => { cur = mkItem('rect', here.x, here.y); items.push(cur); }) },
    { label: 'Add ellipse here', run: () => commit(() => { cur = mkItem('ellipse', here.x, here.y); items.push(cur); }) },
    '-',
    { label: 'Undo', key: mod + 'Z', disabled: !undo.length, run: doUndo },
    { label: 'Deselect', key: 'Esc', disabled: !cur && !curObj, run: () => { cur = null; curObj = null; paint(); props(); } },
  ];
}

function closeMenu() { document.querySelectorAll('.cm').forEach(m => m.remove()); }
function buildMenu(entries, sub) {
  const m = document.createElement('div'); m.className = 'cm' + (sub ? ' sub' : ''); m.setAttribute('role', 'menu');
  for (const e of entries.filter(Boolean)) {
    if (e === '-') { const s = document.createElement('div'); s.className = 'cm-sep'; m.appendChild(s); continue; }
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem');
    b.className = 'cm-i' + (e.danger ? ' danger' : '') + (e.sub ? ' has-sub' : ''); b.disabled = !!e.disabled;
    b.innerHTML = `<span>${e.label}</span>${e.key ? `<kbd>${e.key}</kbd>` : ''}${e.sub ? '<i>›</i>' : ''}`;
    if (e.sub) {
      const s = buildMenu(e.sub, true); b.appendChild(s);
      b.onpointerenter = () => { const r = b.getBoundingClientRect(); s.style.top = '-5px'; s.style.left = '100%'; if (r.right + 200 > innerWidth) { s.style.left = 'auto'; s.style.right = '100%'; } };
    } else b.onclick = () => { closeMenu(); e.run(); };
    m.appendChild(b);
  }
  return m;
}
document.addEventListener('contextmenu', ev => {
  const inLayer = ev.target.closest?.('#layer');
  closeMenu();
  if (!inLayer || editing) return;
  ev.preventDefault();
  const entries = menuFor(ev); if (!entries) return;
  const m = buildMenu(entries); document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(4, Math.min(ev.clientX, innerWidth - w - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(ev.clientY, innerHeight - h - 4)) + 'px';
  m.querySelector('.cm-i:not(:disabled)')?.focus();
});
addEventListener('pointerdown', e => { if (!e.target.closest?.('.cm')) closeMenu(); }, true);
addEventListener('blur', closeMenu); addEventListener('resize', closeMenu);
document.addEventListener('scroll', closeMenu, true);
addEventListener('keydown', e => {
  const m = document.querySelector('.cm'); if (!m) return;
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const list = [...document.querySelectorAll('.cm:not(.sub) > .cm-i:not(:disabled)')], i = list.indexOf(document.activeElement);
  list[(i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length]?.focus();
}, true);

addEventListener('keydown', e => {
  if (editing || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (e.ctrlKey || e.metaKey) {
    const k = e.key;
    if (cur && (k === ']' || k === '}' || k === '[' || k === '{')) { e.preventDefault(); arrange(cur, k === ']' ? 'forward' : k === '}' ? 'front' : k === '[' ? 'backward' : 'back'); return; }
    if (cur && k.toLowerCase() === 'c') { e.preventDefault(); copyItem(cur); return; }
    if (cur && k.toLowerCase() === 'x') { e.preventDefault(); copyItem(cur); const c = cur; commit(() => { items = items.filter(x => x !== c); cur = null; }); return; }
    if (clip && k.toLowerCase() === 'v') { e.preventDefault(); paste(null); return; }
  }
  if (e.key === '[' && !e.ctrlKey) { $('tl').click(); return; }
  if (e.key === ']' && !e.ctrlKey) { $('tr').click(); return; }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); doUndo(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'd' && cur) {
    e.preventDefault(); pushUndo();
    const c = { ...cur, id: crypto.randomUUID(), x: cur.x + 12, y: cur.y + 12, orig: null };
    if (c.type === 'line') { c.x2 += 12; c.y2 += 12; }
    items.push(c); cur = c; paint(); props(); queueSave(); return;
  }
  if (cur) {
    const d = e.shiftKey ? 10 : 1, mv = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
    if (mv) { e.preventDefault(); pushUndo(); cur.x += mv[0]; cur.y += mv[1]; if (cur.type === 'line') { cur.x2 += mv[0]; cur.y2 += mv[1]; } paint(); props(); queueSave(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { pushUndo(); items = items.filter(x => x !== cur); cur = null; paint(); props(); queueSave(); return; }
    if (e.key === 'Escape') { cur = null; paint(); props(); return; }
  }
  if (curObj) {
    const d = e.shiftKey ? 10 : 1, mv = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] }[e.key];
    if (mv) { e.preventDefault(); pushUndo(); const b = oBox(curObj); setEdit(curObj, [b[0] + mv[0], b[1] + mv[1], b[2] + mv[0], b[3] + mv[1]]); paint(); props(); saveObj(curObj); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { deleteObj(curObj); return; }
    if (e.key === 'Escape') { curObj = null; paint(); props(); return; }
  }
  const tk = { v: 'select', t: 'text', r: 'rect', e: 'ellipse', l: 'line', x: 'redact' }[e.key];
  if (tk && !e.ctrlKey) { setTool(tk); return; }
  if (e.key === 'ArrowDown' && sel < state.pageCount - 1) flush().then(() => { sel++; select(); });
  if (e.key === 'ArrowUp' && sel > 0) flush().then(() => { sel--; select(); });
});
refresh();
</script>
