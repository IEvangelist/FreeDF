<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C# PDF Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14111f; --panel:#1e1a2e; --line:#352f4d; --fg:#ece9f7; --mut:#9a94b8; --accent:#7c5cff; --accent2:#e91e8c; --danger:#ff5d73; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; font-weight:700; margin:0 12px 0 0; color:var(--fg); }
  #name { color:var(--mut); margin-right:auto; }
  button, label.btn { background:#2a2440; color:var(--fg); border:1px solid var(--line); padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.primary { background:linear-gradient(90deg,var(--accent),var(--accent2)); border:0; font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  main { flex:1; display:flex; min-height:0; }
  #thumbs { width:220px; overflow-y:auto; padding:12px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:12px; }
  .thumb { position:relative; border:2px solid transparent; border-radius:8px; padding:6px; background:#251f3a; cursor:grab; }
  .thumb.sel { border-color:var(--accent); }
  .thumb.over { border-color:var(--accent2); }
  .thumb img { width:100%; display:block; background:#fff; border-radius:3px; pointer-events:none; }
  .thumb .num { text-align:center; color:var(--mut); font-size:12px; margin-top:4px; }
  .thumb .acts { position:absolute; top:10px; right:10px; display:none; gap:4px; }
  .thumb:hover .acts { display:flex; }
  .acts button { padding:2px 7px; font-size:13px; }
  #view { flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(circle at 30% 20%, #221c38, var(--bg)); }
  #view img { max-width:100%; max-height:100%; box-shadow:0 10px 40px #0009; background:#fff; }
  #empty { color:var(--mut); text-align:center; }
  #drop { outline:3px dashed var(--accent); outline-offset:-12px; }
  footer { padding:6px 16px; color:var(--mut); font-size:12px; background:var(--panel); border-top:1px solid var(--line); }
  .sp { width:1px; height:22px; background:var(--line); margin:0 4px; }
</style>
</head>
<body>
<header>
  <h1>C# PDF Editor</h1>
  <span id="name">No document</span>
  <label class="btn">Open<input id="open" type="file" accept="application/pdf" hidden></label>
  <label class="btn">Merge…<input id="merge" type="file" accept="application/pdf" hidden></label>
  <span class="sp"></span>
  <button id="rl" title="Rotate left">⟲</button>
  <button id="rr" title="Rotate right">⟳</button>
  <button id="del" title="Delete page">Delete</button>
  <button id="title">Set title</button>
  <button id="dl" class="primary">Download</button>
</header>
<main>
  <div id="thumbs"></div>
  <div id="view"><div id="empty">Open a PDF, or drop one here.</div></div>
</main>
<footer id="status">Drag thumbnails to reorder. Rendered by the managed C# renderer.</footer>
<script>
let state = { version: 0, pages: [] }, sel = 0, dragFrom = -1;
const $ = id => document.getElementById(id);
const post = (u, body) => fetch(u, { method: 'POST', body }).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); });
const status = t => $('status').textContent = t;

async function refresh() {
  state = await (await fetch('/api/state')).json();
  $('name').textContent = state.pageCount ? `${state.fileName} - ${state.pageCount} page(s)` : 'No document';
  sel = Math.min(sel, state.pageCount - 1); if (sel < 0) sel = 0;
  const t = $('thumbs'); t.innerHTML = '';
  state.pages.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (i === sel ? ' sel' : ''); d.draggable = true;
    d.innerHTML = `<img src="/api/page/${i}.png?dpi=40&v=${state.version}"><div class="num">${i + 1}</div>
      <div class="acts"><button data-a="l">⟲</button><button data-a="r">⟳</button><button data-a="x">✕</button></div>`;
    d.onclick = e => {
      const a = e.target.dataset?.a;
      if (a === 'l') act(() => post(`/api/rotate/${i}/270`));
      else if (a === 'r') act(() => post(`/api/rotate/${i}/90`));
      else if (a === 'x') { sel = i; act(() => post(`/api/delete/${i}`)); }
      else { sel = i; select(); }
    };
    d.ondragstart = () => dragFrom = i;
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); if (dragFrom >= 0 && dragFrom !== i) { sel = i; act(() => post(`/api/move/${dragFrom}/${i}`)); } dragFrom = -1; };
    t.appendChild(d);
  });
  select();
}
function select() {
  document.querySelectorAll('.thumb').forEach((e, i) => e.classList.toggle('sel', i === sel));
  const v = $('view');
  if (!state.pageCount) { v.innerHTML = '<div id="empty">Open a PDF, or drop one here.</div>'; return; }
  v.innerHTML = `<img src="/api/page/${sel}.png?dpi=110&v=${state.version}">`;
}
async function act(fn) { try { await fn(); await refresh(); } catch (e) { status(e.message); } }
const upload = (url, f) => { const fd = new FormData(); fd.append('f', f); return post(url, fd); };

$('open').onchange = e => e.target.files[0] && act(() => upload('/api/open', e.target.files[0]));
$('merge').onchange = e => e.target.files[0] && act(() => upload('/api/import', e.target.files[0]));
$('rl').onclick = () => state.pageCount && act(() => post(`/api/rotate/${sel}/270`));
$('rr').onclick = () => state.pageCount && act(() => post(`/api/rotate/${sel}/90`));
$('del').onclick = () => state.pageCount && act(() => post(`/api/delete/${sel}`));
$('title').onclick = () => { const t = prompt('Document title'); if (t) act(() => post('/api/title?t=' + encodeURIComponent(t))); };
$('dl').onclick = () => state.pageCount && (location.href = '/api/download');
addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); document.body.id = 'drop'; } });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.id = ''; });
addEventListener('drop', e => { if (e.dataTransfer.files.length) { e.preventDefault(); document.body.id = ''; act(() => upload(state.pageCount ? '/api/import' : '/api/open', e.dataTransfer.files[0])); } });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && sel < state.pageCount - 1) { sel++; select(); }
  if (e.key === 'ArrowUp' && sel > 0) { sel--; select(); }
  if (e.key === 'Delete' && state.pageCount) $('del').click();
});
refresh();
</script>
</body>
</html>
