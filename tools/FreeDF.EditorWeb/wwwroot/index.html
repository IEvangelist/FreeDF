<script>

  } catch (error) {
    if (replacesDocument && document === documentEpoch) {
      $('thumbs').querySelectorAll('img').forEach(img => {
        img.dataset.documentEpoch = documentEpoch;
        thumbnailObserver?.observe(img);

      scheduleNeighborPrefetch();

  if (options?.method === 'POST' && ['/api/new', '/api/open', '/api/close'].includes(url.split('?')[0])) { fa?.clear().catch(reportError); usedFonts.clear(); }

};

addEventListener('error', e => { if (e.error) reportError(e.error); });

const FAM = { Helvetica: 'Arial, Helvetica, sans-serif', Times: '"Times New Roman", Times, serif', Courier: '"Courier New", monospace', Symbol: 'Symbol, serif', ZapfDingbats: '"Zapf Dingbats", "Segoe UI Symbol", serif' };

let fontList = [];
request('/api/fonts').then(r => r.json()).then(l => { fontList = l; });
const normFont = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
let S = 1, pageHint = null, geom = null, spans = [], origKey = '', fields = [], widgets = [], widgetStamp = 0, widgetEl = null, widgetKey = '', objs = [], curObj = null, curSpan = null, formUi = null;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
