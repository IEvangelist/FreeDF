<script>
addEventListener('editor-ready', () => {
const host = window.pdfHost;
let recovery = null, samples = null, fa = null, localFonts = null, documentEpoch = 0;
let fileStatusEpoch = 0;
const usedFonts = new Set();
const request = async (url, options) => {
  const replacesDocument = options?.method === 'POST' && ['/api/new', '/api/open', '/api/recovery', '/api/unlock'].includes(url.split('?')[0]);
  if (replacesDocument) {
    documentEpoch++; selectionEpoch++; buildEpoch++;
    clearTimeout(baseRenderTimer); cancelNeighborPrefetch(); thumbnailObserver?.disconnect();
  }
  const document = documentEpoch;
  let response;
  try {
    response = await (host ? host.request(url, options) : fetch(url, options));
    if (!response.ok) throw new Error(await response.text() || `Editor command failed (${response.status}).`);
  } catch (error) {
    if (replacesDocument && document === documentEpoch) {
      $('thumbs').querySelectorAll('img').forEach(img => {
        img.dataset.documentEpoch = documentEpoch;
        thumbnailObserver?.observe(img);
      });
      scheduleNeighborPrefetch();
    }
    throw error;
  }
  if (options?.method === 'POST' && ['/api/new', '/api/open', '/api/close'].includes(url.split('?')[0])) { fa?.clear(); usedFonts.clear(); }
  if (replacesDocument) {
    selectionEpoch++; buildEpoch++; clearTimeout(baseRenderTimer); shownPage = -1;
    clip = null; pendingUploads.clear(); assetImages.clear();
    if (url.split('?')[0] !== '/api/unlock') formUi?.reset();
  }
  recovery?.changed(url, options?.method ?? 'GET');
  if (options?.method && options.method !== 'GET' && !/^\/api\/(?:asset(?:-|\/|\?|$)|saved(?:\?|$))/.test(url)) {
    selectionCache.clear(); fieldReply = null;
  }
  return response;
};
const assetImages = new Map();
const imageUrl = async url => {
  if (!host) return new URL(url, location.href).href;
  if (!url.startsWith('/api/asset/')) return host.image(url);
  if (!assetImages.has(url)) assetImages.set(url, host.image(url).catch(error => { assetImages.delete(url); throw error; }));
  return assetImages.get(url);
};
function pruneAssetImages() {
  const ids = new Set([...items.map(it => it.asset), ...undo.flatMap(s => JSON.parse(s).items.map(it => it.asset)), clip?.asset].filter(Boolean));
  for (const url of assetImages.keys()) if (!ids.has(url.slice('/api/asset/'.length))) assetImages.delete(url);
}
const reportError = e => { console.error(e); status(e.message); };
addEventListener('unhandledrejection', e => { e.preventDefault(); reportError(e.reason); });
addEventListener('error', e => { if (e.error) reportError(e.error); });
document.querySelectorAll('button[title]').forEach(b => {
  if (!b.hasAttribute('aria-label')) b.setAttribute('aria-label', b.title);
});
document.querySelector('label[for="img"], label:has(#img)').onkeydown = e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('img').click(); }
};
let state = { version: 0, pages: [] }, sel = 0, dragFrom = -1, buildEpoch = 0, shownPage = -1, baseRenderTimer = 0, neighborPrefetchTimer = 0, layoutBuildTimer = 0, pageImageRetryEpoch = -1;
let items = [], cur = null, tool = 'select', zoom = 1, fitMode = 'page', fitP0 = 1, preview = false, undo = [], saveT = 0, editing = false;
const pendingUploads = new Map();
let locked = localStorage.getItem('lock-geom') === '1';
const GEOM = new Set(['x', 'y', 'w', 'h', 'x2', 'y2']);
const $ = id => document.getElementById(id);
const post = (u, body) => request(u, { method: 'POST', body });
const status = t => $('status').textContent = t;
const FAM = { Helvetica: 'Arial, Helvetica, sans-serif', Times: '"Times New Roman", Times, serif', Courier: '"Courier New", monospace', Symbol: 'Symbol, serif', ZapfDingbats: '"Zapf Dingbats", "Segoe UI Symbol", serif' };
const famCss = f => FAM[f] ?? `"${String(f).replace(/"/g, '')}", sans-serif`;
let fontList = [];
request('/api/fonts').then(r => r.json()).then(l => { fontList = l; });
const normFont = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
let S = 1, pageHint = null, geom = null, spans = [], origKey = '', fields = [], widgets = [], widgetStamp = 0, widgetEl = null, widgetKey = '', objs = [], curObj = null, curSpan = null, formUi = null;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const ic = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const okey = () => items.filter(i => i.orig != null).map(i => i.orig).sort((a, b) => a - b).join(',');
// Maps a PDF font name such as "ABCDEF+Calibri-BoldItalic" to the best installed family, falling back to the standard three.
const fontFamily = n => {
  const base = normFont(n.replace(/^[A-Z]{6}\+/, '').replace(/(mt|ps|psmt)?([-,]?(bold|italic|oblique|regular|roman|black|heavy|light))*$/i, ''));
  let best = null;
  for (const f of fontList) { const k = normFont(f.family); if (k && base.startsWith(k) && (!best || k.length > normFont(best).length)) best = f.family; }
  if (best) return best;
  return /courier|mono/i.test(n) ? 'Courier' : /times|serif|georgia|garamond|minion/i.test(n) && !/sans/i.test(n) ? 'Times' : 'Helvetica';
};

function spanItem(s, text = s.text) {
  const it = { id: crypto.randomUUID(), type: 'text', x: s.x, y: s.y - 0.95 * s.size, w: s.width, h: 0, text, font: fontFamily(s.font), originalFont: s.font, spacing: s.spacing,
    size: s.size, bold: /bold|black|heavy/i.test(s.font), italic: /italic|oblique/i.test(s.font), color: s.color, fill: '', stroke: '', strokeWidth: 0,
    opacity: 1, asset: '', x2: 0, y2: 0, orig: s.index };
  it.oStyle = `${it.font}|${it.bold}|${it.italic}`;
  return it;
}

// Only actual edits replace the original operator.
function convertSpan(s, text = s.text) {
  pushUndo();
  const it = spanItem(s, text);
  items.push(it); cur = it; curObj = null; curSpan = null; paint(); props(); queueSave(120);
  return it;
}

function selectSpan(s) { curSpan = s; cur = null; curObj = null; paint(); props(); }

function spanProps() {
  const s = curSpan, p = $('props'), draft = spanItem(s);
  const number = (key, label) => `<label class="fld"><span>${label}</span><input type="number" step="0.1" data-original="${key}" value="${draft[key]}"${locked && GEOM.has(key) ? ' disabled' : ''}></label>`;
  p.innerHTML = `<section class="head"><h2>Text <em>from page</em></h2></section>
    <section><label class="fld"><span>Content</span><textarea rows="3" data-original-text>${esc(s.text)}</textarea></label>
