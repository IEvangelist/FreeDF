name: Diagnose editor save timing (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: editor-validation-aot
          run-id: 41091967536
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - uses: actions/download-artifact@v4
        with:
          name: editor-validation-aot
          run-id: 41113836396
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - run: dotnet build tools/AdoBye.EditorSmoke -c Release
      - shell: pwsh
        run: ./tools/AdoBye.EditorSmoke/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Compare retained AOT runtimes with identical harness
        env:
          EDITOR_PROFILE_REPORT_ONLY: '1'
          EDITOR_PROFILE_BASELINE_CONTROL: '1'
        run: |
          mkdir -p "${{ runner.temp }}/save-evidence"
          cp -a "${{ runner.temp }}/candidate/editor-pages/wwwroot" "${{ runner.temp }}/candidate-old-ui"
          git show 1f4bcae:tools/AdoBye.EditorWeb/wwwroot/index.html > "${{ runner.temp }}/candidate-old-ui/index.html"
          sed -i 's|<head>|<head><base href="/csharp-pdf/"><meta name="editor-host" content="wasm">|' "${{ runner.temp }}/candidate-old-ui/index.html"
          git show 1f4bcae:tools/AdoBye.EditorWasm/wwwroot/worker.js > "${{ runner.temp }}/candidate-old-ui/worker.js"
          for variant in candidate previous candidate-old-ui; do
            site="${{ runner.temp }}/$variant/editor-pages/wwwroot"
            if [ "$variant" = candidate-old-ui ]; then site="${{ runner.temp }}/candidate-old-ui"; fi
            dotnet run --no-build -c Release --project tools/AdoBye.EditorSmoke -- \
              --profile "$site" "${{ runner.temp }}/save-evidence/$variant.json" \
              "${{ github.workspace }}/samples/09-images.pdf" \
              "${{ github.workspace }}/samples/20-report.pdf"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-save-diagnostic
          path: ${{ runner.temp }}/save-evidence/
