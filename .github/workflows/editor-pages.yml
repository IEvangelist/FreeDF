name: Publish browser PDF editor

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      aot:
        description: Use AOT (disable only for an explicit non-AOT fallback)
        type: boolean
        default: true
      deploy:
        description: Deploy after the site builds, independently of test results (requires chunk=all)
        type: boolean
        default: false
      chunk:
        description: "Run one validation chunk only (see docs/ci.md). Partial runs never package or deploy."
        type: choice
        default: all
        options: [all, node, dotnet-editor, dotnet-codecs, dotnet-render, default, forms, authoring, boot, viewport, a11y, responsive, profile-invariants]

permissions:
  contents: read

concurrency:
  group: editor-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EDITOR_AOT: ${{ github.event_name != 'workflow_dispatch' || inputs.aot }}
  EDITOR_CHUNK: ${{ github.event_name == 'workflow_dispatch' && inputs.chunk || 'all' }}
  CACHE_VERSION: v1

jobs:
  # Change detection: docs/backlog-only changes skip every heavy job; the always-run `validated`
  # gate still reports success. Unknown or unreadable diffs fail safe to "run everything".
  plan:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.plan.outputs.code }}
      unit: ${{ steps.plan.outputs.unit }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename' 2>/dev/null) && [ -n "$files" ] && [ "$(echo "$files" | wc -l)" -lt 300 ]; then
              # Only these paths are known not to affect the published site, tests or gates.
              if ! echo "$files" | grep -Evq '^(docs/|backlog/|[^/]+\.md$|LICENSE$|\.github/(ISSUE_TEMPLATE/|CODEOWNERS$|dependabot\.yml$))'; then code=false; fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          pick() {
            if [ "$code" != true ]; then return; fi
            if [ "$EDITOR_CHUNK" = all ]; then printf '%s\n' "$@"; else for c in "$@"; do [ "$c" = "$EDITOR_CHUNK" ] && echo "$c"; done; fi
          }
          echo "unit=$(pick node dotnet-editor dotnet-codecs dotnet-render | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "smoke=$(pick default forms authoring boot viewport a11y responsive profile-invariants | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.smoke != '[]'
    uses: ./.github/workflows/editor-site.yml
    with:
      aot: ${{ github.event_name != 'workflow_dispatch' || inputs.aot }}
  # Source-level suites; independent of the published site so they run alongside the build.
  unit:
    needs: plan
    if: needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Run ${{ matrix.chunk }}
        shell: pwsh
        run: ./tools/Invoke-EditorChunk.ps1 -Chunk '${{ matrix.chunk }}'

  # One job per functional browser smoke chunk. Timing gates are non-blocking and live in editor-perf.yml.
  smoke:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/download-artifact@v8
        with:
          name: editor-site
          path: ${{ runner.temp }}/editor-pages
      - name: Verify the site is exactly what the build job produced
        shell: pwsh
        run: ./tools/Site-Manifest.ps1 -Site '${{ runner.temp }}/editor-pages/wwwroot' -Manifest '${{ runner.temp }}/editor-pages/editor-site.sha256' -Verify
      - name: Build browser smoke runner
        run: dotnet build tools/FreeDF.EditorSmoke -c Release
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - name: Install Chromium
        shell: pwsh
        run: ./tools/FreeDF.EditorSmoke/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run ${{ matrix.chunk }}
        shell: pwsh
        run: ./tools/Invoke-EditorChunk.ps1 -Chunk '${{ matrix.chunk }}' -Site '${{ runner.temp }}/editor-pages/wwwroot' -Work '${{ runner.temp }}/editor-chunks'
      - name: Retain validation evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-validation-${{ matrix.chunk }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/editor-chunks

  # Aggregate test status remains visible, but does not gate packaging or deployment.
  validated:
    needs: [plan, build, unit, smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every planned validation job to succeed
        shell: bash
        run: |
          echo "plan=${{ needs.plan.result }} build=${{ needs.build.result }} unit=${{ needs.unit.result }} smoke=${{ needs.smoke.result }} chunk=$EDITOR_CHUNK"
          [ "${{ needs.plan.result }}" = success ] || exit 1
          # A job may only be skipped when the plan left it with nothing to run.
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = '[]' ]; }; }
          ok "${{ needs.unit.result }}" '${{ needs.plan.outputs.unit }}'
          ok "${{ needs.smoke.result }}" '${{ needs.plan.outputs.smoke }}'
          ok "${{ needs.build.result }}" '${{ needs.plan.outputs.smoke }}'

  package:
    if: needs.build.result == 'success' && needs.plan.outputs.code == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.deploy && inputs.chunk == 'all'))
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: editor-site
          path: ${{ runner.temp }}/editor-pages
      - name: Verify the site is exactly what the build job produced
        shell: pwsh
        run: ./tools/Site-Manifest.ps1 -Site '${{ runner.temp }}/editor-pages/wwwroot' -Manifest '${{ runner.temp }}/editor-pages/editor-site.sha256' -Verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/editor-pages/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && (github.event_name != 'workflow_dispatch' || (inputs.deploy && inputs.chunk == 'all'))
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
