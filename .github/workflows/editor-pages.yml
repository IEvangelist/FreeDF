name: Publish browser PDF editor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      aot:
        description: Use AOT (disable only for an explicit non-AOT fallback)
        type: boolean
        default: true
      deploy:
        description: Deploy after all validation gates pass (requires chunk=all)
        type: boolean
        default: false
      chunk:
        description: "Run one validation chunk only (see docs/ci.md). Partial runs never package or deploy."
        type: choice
        default: all
        options: [all, node, dotnet-editor, dotnet-codecs, dotnet-render, default, forms, authoring, boot, viewport, a11y, responsive, profile]

permissions:
  contents: read

concurrency:
  group: editor-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

env:
  EDITOR_AOT: ${{ github.event_name != 'workflow_dispatch' || inputs.aot }}
  EDITOR_CHUNK: ${{ github.event_name == 'workflow_dispatch' && inputs.chunk || 'all' }}
  # Bump to invalidate every content-addressed cache below.
  CACHE_VERSION: v1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - id: plan
        shell: bash
        run: |
          pick() { if [ "$EDITOR_CHUNK" = all ]; then printf '%s\n' "$@"; else for c in "$@"; do [ "$c" = "$EDITOR_CHUNK" ] && echo "$c"; done; fi; }
          echo "unit=$(pick node dotnet-editor dotnet-codecs dotnet-render | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "smoke=$(pick default forms authoring boot viewport a11y responsive profile | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  # Publishes the site once. The result is cached by a hash of every input that can change it
  # (an exact hit skips the AOT publish) and handed to the smoke jobs as one artifact.
  build:
    needs: plan
    if: needs.plan.outputs.smoke != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Compute input hashes
        id: hash
        shell: bash
        run: |
          # Everything that can change published bytes, minus tests, build outputs and this workflow.
          echo "site=${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.*', 'src/**', 'samples/**', 'tools/AdoBye.EditorWasm/**', 'tools/AdoBye.EditorWeb/**', 'tools/AdoBye.Samples/**', 'tools/Publish-EditorPages.ps1', '!**/bin/**', '!**/obj/**', '!tools/AdoBye.EditorWasm/tests/**', '!**/*.test.*', '!tools/AdoBye.EditorWeb/e2e_*') }}" >> "$GITHUB_OUTPUT"
          # Inputs of the compile/AOT step only; static web assets (html/css/js) are excluded so
          # an asset-only change reuses the incremental AOT intermediates.
          echo "compile=${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.*', 'src/**', 'samples/_gen/fonts/**', 'tools/AdoBye.EditorWasm/*.cs', 'tools/AdoBye.EditorWasm/*.csproj', 'tools/AdoBye.EditorWeb/*.cs', 'tools/AdoBye.EditorWeb/*.csproj', '!**/bin/**', '!**/obj/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore published site (exact input match)
        id: site-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/editor-pages
          key: site-${{ env.CACHE_VERSION }}-${{ runner.os }}-aot-${{ env.EDITOR_AOT }}-${{ steps.hash.outputs.site }}
      - uses: actions/setup-dotnet@v6
        if: steps.site-cache.outputs.cache-hit != 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore incremental publish intermediates
        if: steps.site-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/editor-publish-build
          key: obj-${{ env.CACHE_VERSION }}-${{ runner.os }}-aot-${{ env.EDITOR_AOT }}-${{ steps.hash.outputs.compile }}
          restore-keys: |
            obj-${{ env.CACHE_VERSION }}-${{ runner.os }}-aot-${{ env.EDITOR_AOT }}-
      - name: Install pinned SDK WebAssembly toolchain
        if: steps.site-cache.outputs.cache-hit != 'true' && env.EDITOR_AOT == 'true'
        run: dotnet workload install wasm-tools --skip-manifest-update --disable-parallel
      - name: Publish static WebAssembly editor
        if: steps.site-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $options = @{
            Output = '${{ runner.temp }}/editor-pages'
            ArtifactsPath = '${{ runner.temp }}/editor-publish-build'
            Aot = $env:EDITOR_AOT -eq 'true'
          }
          ./tools/Publish-EditorPages.ps1 @options
      - name: Record site manifest
        shell: pwsh
        run: ./tools/Site-Manifest.ps1 -Site '${{ runner.temp }}/editor-pages/wwwroot' -Manifest '${{ runner.temp }}/editor-pages/editor-site.sha256'
      - name: Hand the site to validation and deployment
        uses: actions/upload-artifact@v7
        with:
          name: editor-site
          path: ${{ runner.temp }}/editor-pages
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # Source-level suites; independent of the published site so they run alongside the build.
  unit:
    needs: plan
    if: needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Run ${{ matrix.chunk }}
        shell: pwsh
        run: ./tools/Invoke-EditorChunk.ps1 -Chunk '${{ matrix.chunk }}'

  # One job per browser smoke chunk so timing-sensitive ones (profile, save-overlap) never share a runner.
  smoke:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/download-artifact@v8
        with:
          name: editor-site
          path: ${{ runner.temp }}/editor-pages
      - name: Verify the site is exactly what the build job produced
        shell: pwsh
        run: ./tools/Site-Manifest.ps1 -Site '${{ runner.temp }}/editor-pages/wwwroot' -Manifest '${{ runner.temp }}/editor-pages/editor-site.sha256' -Verify
      - name: Build browser smoke runner
        run: dotnet build tools/AdoBye.EditorSmoke -c Release
      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - name: Install Chromium
        shell: pwsh
        run: ./tools/AdoBye.EditorSmoke/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run ${{ matrix.chunk }}
        shell: pwsh
        run: ./tools/Invoke-EditorChunk.ps1 -Chunk '${{ matrix.chunk }}' -Site '${{ runner.temp }}/editor-pages/wwwroot' -Work '${{ runner.temp }}/editor-chunks'
      - name: Retain validation evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-validation-${{ matrix.chunk }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/editor-chunks

  # Single required gate: nothing is packaged or deployed unless every planned job passed.
  validated:
    needs: [plan, build, unit, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned validation job to succeed
        shell: bash
        run: |
          echo "plan=${{ needs.plan.result }} build=${{ needs.build.result }} unit=${{ needs.unit.result }} smoke=${{ needs.smoke.result }} chunk=$EDITOR_CHUNK"
          [ "${{ needs.plan.result }}" = success ] || exit 1
          # A job may only be skipped when the plan left it with nothing to run.
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = '[]' ]; }; }
          ok "${{ needs.unit.result }}" '${{ needs.plan.outputs.unit }}'
          ok "${{ needs.smoke.result }}" '${{ needs.plan.outputs.smoke }}'
          ok "${{ needs.build.result }}" '${{ needs.plan.outputs.smoke }}'

  package:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.deploy && inputs.chunk == 'all'))
    needs: validated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: editor-site
          path: ${{ runner.temp }}/editor-pages
      - name: Verify the site is exactly what was validated
        shell: pwsh
        run: ./tools/Site-Manifest.ps1 -Site '${{ runner.temp }}/editor-pages/wwwroot' -Manifest '${{ runner.temp }}/editor-pages/editor-site.sha256' -Verify
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/editor-pages/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && (github.event_name != 'workflow_dispatch' || (inputs.deploy && inputs.chunk == 'all'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
